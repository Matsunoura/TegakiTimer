<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | TegakiTimer</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      /* ★ 無限拡大を防止し、画面中央に 4:3 で固定するCSSを追加 */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* スクロールバーによるループ拡大を防止 */
        background-color: #231f20; /* 余白の色（お好みで変更可） */
        display: flex;
        justify-content: center; /* 水平中央揃え */
        align-items: center;     /* 垂直中央揃え */
      }

      #unity-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative; /* ローディングバー等の基準にする */
      }

      /* ★ Canvas の最大サイズを 4:3 (1200:900) に固定し、画面からはみ出さないようにロックする */
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        /* 高さを基準に、横幅が 4:3 (1.333) 比率を超えないように制限 */
        max-width: calc(100vh * 4 / 3) !important;
        /* 横幅を基準に、高さが 3:4 (0.75) 比率を超えないように制限 */
        max-height: calc(100vw * 3 / 4) !important;
        aspect-ratio: 4 / 3; /* ブラウザに比率を伝える */
        display: block;
        background: transparent; /* 背景を透明に（Unity側の設定に任せる） */
      }

      /* デフォルトの style.css のローディングバー等の位置がずれる場合の補正 */
      #unity-loading-bar {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <!-- width, height 属性は Unityエンジンが参照するのでそのまま残す -->
      <canvas id="unity-canvas" width=1200 height=900 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/TegakiTimer.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/TegakiTimer.data",
        frameworkUrl: buildUrl + "/TegakiTimer.framework.js",
        codeUrl: buildUrl + "/TegakiTimer.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Matsunoura",
        productName: "TegakiTimer",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // ★ 競合を避けるため、モバイル判定による viewport の書き換え処理はコメントアウト（または削除）
      /*
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }
      */

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
